# secret.example.yaml
#
# Copy this file to secret.yaml (gitignored -- see .gitignore -- never commit the real one)
# and fill in real values. Mirrors .env.example exactly -- same credentials, same
# meaning, just delivered as a Kubernetes Secret's env vars instead of a local .env file.
# See .env.example's own comments for what each value is and where to create it; not
# repeated here to avoid the two drifting out of sync -- if in doubt, that file is the
# canonical reference for what each setting does.
#
# Prefer creating this directly from the command line over ever writing real credentials to
# a file at all, e.g.:
#   kubectl create secret generic linode-instance-scheduler-secrets \
#     -n linode-instance-scheduler \
#     --from-literal=LINODE_API_TOKEN='<your-token>'
# (add more --from-literal=KEY=value pairs for whichever of the optional ones below you use).
# The `stringData` form here is for convenience when you do want a reviewable file locally --
# Kubernetes base64-encodes it into `data` server-side on apply; that is NOT encryption, so
# treat secret.yaml with the same care as a real .env file (never commit it, restrict who can
# read it on disk).
apiVersion: v1
kind: Secret
metadata:
  name: linode-instance-scheduler-secrets
  namespace: linode-instance-scheduler
type: Opaque
stringData:
  # Required. Full-access Personal Access Token -- this tool creates/deletes instances,
  # volumes, tags, and reserved IPs; a read-only or scoped-down token fails partway through
  # real operations.
  LINODE_API_TOKEN: ""

  # Optional -- only needed for "Login with Linode" OAuth on the REST API/dashboard. Leave
  # all three blank to run the API without OAuth (it will refuse login attempts, but every
  # other route still works for scripted/internal use with a directly-issued session --
  # see the customer guide).
  LINODE_OAUTH_CLIENT_ID: ""
  LINODE_OAUTH_CLIENT_SECRET: ""
  # Must exactly match the redirect URI configured on the OAuth App in Cloud Manager, e.g.
  # https://<your-exposed-hostname>/oauth/callback -- see the LKE deployment guide
  # section 6 for how this URI relates to the Service/Ingress you expose.
  LINODE_OAUTH_REDIRECT_URI: ""

  # Optional -- Object Storage backup of everything a Linode resource tag can't hold
  # (network config for multi-interface instances, unregistered SSH keys, plan/firewall
  # attributes, labels/customer tags). All four must be set together or none take effect.
  # See docs/OPERATIONS.md's Backup & recovery section for the full design.
  LINODE_OBJ_STORAGE_BUCKET: ""
  LINODE_OBJ_STORAGE_ENDPOINT: ""
  LINODE_OBJ_STORAGE_ACCESS_KEY: ""
  LINODE_OBJ_STORAGE_SECRET_KEY: ""

  # Encrypts the stored copies of the deployment SSH key (database, backups, Object Storage).
  # At least 12 characters -- e.g. `openssl rand -base64 24`. Its recovery copy is kept in a
  # private StackScript in your Linode account (the API token needs StackScripts read/write).
  LIS_SSH_KEY_PASSPHRASE: ""

  # Optional -- alerts (scheduler stopped, backups failing, key not fully protected, nodes off
  # schedule). Webhook (Slack/Teams-compatible JSON POST) and/or email over SMTP.
  LIS_ALERT_WEBHOOK_URL: ""
  LIS_ALERT_EMAIL_TO: ""
  LIS_ALERT_SMTP_HOST: ""
  LIS_ALERT_SMTP_PORT: ""
  LIS_ALERT_SMTP_SECURITY: ""
  LIS_ALERT_SMTP_USER: ""
  LIS_ALERT_SMTP_PASSWORD: ""
  LIS_ALERT_EMAIL_FROM: ""

  # Optional -- your age public key(s): an encrypted copy of these settings and the SSH key is
  # kept in Object Storage that only your age identity opens. `env-restore --print` turns it back
  # into these values on a new cluster.
  LIS_ENV_BACKUP_RECIPIENTS: ""

  # Optional -- an uptime monitor's ping URL; the scheduler pings it every minute and the monitor
  # alerts you when the pings stop.
  LIS_HEARTBEAT_URL: ""
